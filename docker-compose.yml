version: '3.8'

services:
  web:
    build: .
    ports:
      - '8000:8000'
    depends_on:
      - postgres
    volumes:
      - .:/app

    environment:
      - DEBUG=0
    env_file:
      - .env

  scraper:
    build: .
    volumes:
      - .:/app
    environment:
      - DEBUG=0
    depends_on:
      - postgres
    command: python manage.py scraper 

  postgres:
    image: postgres:15
    container_name: django-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: django-postgres
    ports:
      - '5432:5432'
    volumes:
      - django-db-data:/var/lib/postgresql/data

volumes:
  django-db-data:


